name: One-time Mulder migration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination at workspace root
        uses: actions/checkout@v7
        with:
          repository: dominionochai/Ekchain
          ref: main
          path: .
      - name: Check out pinned source
        uses: actions/checkout@v7
        with:
          repository: calebevans/mulder
          ref: 5321847887fe1fcb5399cec0a1703db9c513bac8
          path: .mulder-source
          persist-credentials: false
      - name: Copy source tree and verify exact blobs
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='/.git' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/NOTICE.md' \
            --exclude='/.github/workflows/***' \
            .mulder-source/ ./

          count=0
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|LICENSE|NOTICE.md|.github/workflows/*) continue ;;
            esac
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing copied source path: $path"
              exit 1
            fi
            source_blob="$(git -C .mulder-source rev-parse "HEAD:$path")"
            destination_blob="$(git hash-object -- "$path")"
            if [[ "$source_blob" != "$destination_blob" ]]; then
              echo "::error::Blob mismatch for $path: source=$source_blob destination=$destination_blob"
              exit 1
            fi
            count=$((count + 1))
          done < <(git -C .mulder-source ls-files -z)

          [[ "$(git hash-object README.md)" == "bf20767fede8653e1b4ae4b53ca38dd7ac4b6f62" ]]
          [[ "$(git hash-object LICENSE)" == "caed799e2ea59f9c6234b8f3fde6ed91a66a683c" ]]
          [[ "$(git hash-object NOTICE.md)" == "89e4efe92cd09141f73348b550163712e2c308e4" ]]
          echo "Verified copied source files (excluding protected docs and workflows): $count"
          rm -rf .mulder-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Mulder source tree from 5321847"
          migration_commit="$(git rev-parse HEAD)"
          echo "Migration commit: $migration_commit"
          git push origin HEAD:main
