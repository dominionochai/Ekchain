[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ekchain"
dynamic = ["version"]
description = "Autonomous multi-agent climate forensics and eco-data auditing platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dominionochai" },
]
keywords = [
    "climate",
    "carbon",
    "esg",
    "forensics",
    "blockchain",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    "sqlalchemy>=2.0",
    "detect-secrets>=1.5",
    "pydantic>=2.12",
    "click>=8.3",
    "jinja2>=3.1.6",
    "markdown>=3.6",
    "claude-agent-sdk>=0.2",
    "rich>=15.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
stix = ["stix2>=3.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "types-psutil",
    # `make dist-check` / the release workflow validate the built metadata
    # before anything is uploaded.
    "twine",
]

[project.urls]
Homepage = "https://github.com/dominionochai/Ekchain"
Source = "https://github.com/dominionochai/Ekchain"
Documentation = "https://github.com/dominionochai/Ekchain/blob/main/docs/usage-guide.md"
Issues = "https://github.com/dominionochai/Ekchain/issues"
Changelog = "https://github.com/dominionochai/Ekchain/releases"

[project.scripts]
ekchain = "ekchain.cli:cli"
ekchain-forensics = "ekchain.cli:cli"

[tool.hatch.version]
path = "src/ekchain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ekchain"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "rich",
    "rich.*",
    "markdown",
    "yaml",
    "stix2",
    "stix2.*",
    "weasyprint",
    "weasyprint.*",
    "psutil",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
ignore_missing_imports = true

# Tests monkeypatch through the module under test --
# `monkeypatch.setattr(probes.shutil, "which", ...)` is the standard pytest
# idiom, and patching `install.ASSETS` is deliberately *not* the same as
# patching `manifest.ASSETS`. `no_implicit_reexport` (implied by --strict)
# rejects every such access, and the option is read from the module being
# imported *from*, so it has to be declared here rather than under `tests.*`.
# Scoped to the three modules the suite actually reaches into, so the rest of
# the package keeps the explicit-re-export guarantee.
[[tool.mypy.overrides]]
module = [
    "ekchain.assets.install",
    "ekchain.assets.paths",
    "ekchain.doctor.probes",
]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"